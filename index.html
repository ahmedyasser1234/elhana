<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>El Hana Group Tourism & Safaris | Sharm El Sheikh Luxury Tours</title>
    <meta name="description" content="Book premium desert safaris, ATV quad bike adventures, buggy tours, Bedouin sunset experiences, luxury yacht trips, snorkeling, and diving in Sharm El Sheikh with El Hana Group." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.performance) {
          const origMeasure = window.performance.measure;
          if (origMeasure) {
            window.performance.measure = function(name, startOrOptions, end) {
              try {
                return origMeasure.call(window.performance, name, startOrOptions, end);
              } catch (e) {
                // Prevents React performance measurement DOMException from interrupting rendering
              }
            };
          }
          const origClear = window.performance.clearMeasures;
          if (origClear) {
            window.performance.clearMeasures = function(name) {
              try {
                return origClear.call(window.performance, name);
              } catch (e) {}
            };
          }
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans antialiased selection:bg-[#0284C7] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
