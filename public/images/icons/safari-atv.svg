<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="atvBody" x1="16" y1="18" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="32" cy="54" rx="26" ry="5" fill="#000000" fill-opacity="0.35"/>

  <!-- Rear Tires (Wide knobby off-road treads) -->
  <rect x="7" y="30" width="10" height="20" rx="4" fill="url(#tireGrad)"/>
  <rect x="47" y="30" width="10" height="20" rx="4" fill="url(#tireGrad)"/>
  <!-- Rear Tread Grips -->
  <path d="M7 35H17M7 40H17M7 45H17M47 35H57M47 40H57M47 45H57" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Suspension & Axle System -->
  <path d="M14 42L26 38M50 42L38 38" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Red Shock Absorber Springs -->
  <path d="M19 39L23 33M45 39L41 33" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front Tires -->
  <rect x="13" y="26" width="10" height="24" rx="4" fill="url(#tireGrad)"/>
  <rect x="41" y="26" width="10" height="24" rx="4" fill="url(#tireGrad)"/>
  <!-- Front Tread Grips -->
  <path d="M13 31H23M13 37H23M13 43H23M41 31H51M41 37H51M41 43H51" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Alloy Rims -->
  <circle cx="18" cy="38" r="4.5" fill="url(#rimGrad)"/>
  <circle cx="18" cy="38" r="2" fill="#0F172A"/>
  <circle cx="46" cy="38" r="4.5" fill="url(#rimGrad)"/>
  <circle cx="46" cy="38" r="2" fill="#0F172A"/>

  <!-- Main ATV Body / Hood / Front Fender -->
  <path d="M22 24L26 19H38L42 24L48 28L46 35L41 36L38 32H26L23 36L18 35L16 28L22 24Z" fill="url(#atvBody)"/>
  <!-- Glossy Highlight on Fender -->
  <path d="M25 21H39L43 25L32 24L21 25L25 21Z" fill="#BAE6FD" fill-opacity="0.6"/>

  <!-- Front Grille & Bull Bar -->
  <path d="M26 31H38V38C38 40.2 36.2 42 34 42H30C27.8 42 26 40.2 26 38V31Z" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <path d="M28 34H36M29 37H35" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Bull Bar Protection Ring -->
  <path d="M23 40C23 43 27 45 32 45C37 45 41 43 41 40" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sporty Handlebars & Handguards -->
  <path d="M18 13H24L30 16H34L40 13H46" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="11" width="5" height="4" rx="1.5" fill="#0284C7"/>
  <rect x="44" y="11" width="5" height="4" rx="1.5" fill="#0284C7"/>
  
  <!-- Digital Speedometer / Center Console -->
  <rect x="29" y="14" width="6" height="4" rx="1" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8"/>
  <line x1="31" y1="16" x2="33" y2="16" stroke="#38BDF8" stroke-width="1"/>

  <!-- Dual LED Headlights Glowing -->
  <circle cx="27" cy="27" r="3" fill="#FEF08A" filter="url(#glowEffect)"/>
  <circle cx="27" cy="27" r="1.5" fill="#FFFFFF"/>
  <circle cx="37" cy="27" r="3" fill="#FEF08A" filter="url(#glowEffect)"/>
  <circle cx="37" cy="27" r="1.5" fill="#FFFFFF"/>
</svg>
