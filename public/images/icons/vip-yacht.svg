<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="yachtHull" x1="10" y1="36" x2="56" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cabinGrad" x1="20" y1="20" x2="48" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldStripe" x1="8" y1="42" x2="56" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="tintedGlass" x1="24" y1="24" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="seaWake" x1="6" y1="48" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Water Waves / Wake Splash -->
  <path d="M4 51C12 49 18 53 26 51C34 49 40 53 48 51C54 49.5 58 52 62 51C60 55 48 56 32 56C16 56 6 54 4 51Z" fill="url(#seaWake)" fill-opacity="0.8"/>
  <path d="M8 50C16 48 24 51 34 49C44 47 50 51 58 49" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Upper Flybridge & Radar Canopy -->
  <path d="M28 14H40L42 19H26L28 14Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Radar Arch / Antenna -->
  <line x1="33" y1="11" x2="33" y2="14" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="33" cy="11" rx="2.5" ry="1.2" fill="#F59E0B"/>
  <line x1="36" y1="9" x2="36" y2="14" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Main Superstructure / VIP Cabin -->
  <path d="M22 28L25 19H44L47 28H22Z" fill="url(#cabinGrad)" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Panoramic Tinted Cabin Windows -->
  <path d="M26 22H33V26H28L26 22Z" fill="url(#tintedGlass)"/>
  <rect x="35" y="22" width="8" height="4" rx="0.8" fill="url(#tintedGlass)"/>
  <!-- Window Glass Glare -->
  <path d="M27 23L31 23M36 23L41 23" stroke="#BAE6FD" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Aft Sundeck Roof Extension -->
  <path d="M16 28H24V25H18L16 28Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Main Luxury Yacht Hull -->
  <path d="M8 38C16 38 46 37 54 30C55 31 56 33 55 35L49 46C46 47 18 47 10 44L8 38Z" fill="url(#yachtHull)"/>

  <!-- VIP Royal Gold Waterline Stripe -->
  <path d="M9.5 42C16 43 45 43 51 38" stroke="url(#goldStripe)" stroke-width="2" stroke-linecap="round"/>

  <!-- Porthole Windows in Hull -->
  <circle cx="20" cy="39" r="1.5" fill="#0284C7" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="26" cy="39" r="1.5" fill="#0284C7" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="32" cy="39" r="1.5" fill="#0284C7" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="38" cy="38.5" r="1.5" fill="#0284C7" stroke="#F59E0B" stroke-width="0.6"/>

  <!-- Prow / Bow Railing -->
  <path d="M47 29L53 29L50 33" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Sunlit Highlight along the Hull Top Edge -->
  <path d="M10 38C20 38 44 37 52 31" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
</svg>
