<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="luxYachtGrad" x1="20" y1="12" x2="58" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="luxYachtGlass" x1="28" y1="16" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="luxBuggyBody" x1="8" y1="34" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="luxTire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="luxGoldBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="luxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="32" cy="55" rx="26" ry="4" fill="#000000" fill-opacity="0.35"/>

  <!-- ==================== BACKGROUND: 3-DECK LUXURY MOTOR YACHT ==================== -->
  <!-- Upper Radar Mast & Top Flybridge -->
  <line x1="42" y1="7" x2="42" y2="10" stroke="#94A3B8" stroke-width="1.5"/>
  <ellipse cx="42" cy="7" rx="2" ry="1" fill="#F59E0B"/>
  <path d="M36 10H48L49 14H35L36 10Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Middle Bridge & Panoramic Glass -->
  <path d="M30 14H52L54 20H28L30 14Z" fill="url(#luxYachtGrad)" stroke="#CBD5E1" stroke-width="0.8"/>
  <path d="M33 16H42V19H34L33 16Z" fill="url(#luxYachtGlass)"/>
  <rect x="44" y="16" width="7" height="3" rx="0.5" fill="url(#luxYachtGlass)"/>

  <!-- Main Luxury Yacht Hull with Gold Line -->
  <path d="M22 20C30 20 54 19 60 14C61 15 62 17 61 19L56 26C52 27 30 27 24 25L22 20Z" fill="url(#luxYachtGrad)"/>
  <path d="M23 23C30 24 53 24 58 20" stroke="url(#luxGoldBadge)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Turquoise Red Sea Water Wake under Yacht -->
  <path d="M20 27C26 26 34 28 42 27C50 26 56 28 62 27" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- ==================== FOREGROUND: 250CC SAFARI OFF-ROAD DUNE BUGGY ==================== -->
  <!-- Buggy Steel Roll Cage (Black & Chrome) -->
  <path d="M14 36L18 24H32L36 36" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="18" y1="28" x2="32" y2="28" stroke="#1E293B" stroke-width="1.8"/>
  <line x1="25" y1="24" x2="25" y2="36" stroke="#64748B" stroke-width="1.8"/>

  <!-- Roof Light Bar (4 Off-road Spotlights) -->
  <rect x="18" y="22" width="14" height="2.5" rx="1.2" fill="#0F172A"/>
  <circle cx="20" cy="23.2" r="1.2" fill="#FEF08A"/>
  <circle cx="23.3" cy="23.2" r="1.2" fill="#FEF08A"/>
  <circle cx="26.6" cy="23.2" r="1.2" fill="#FEF08A"/>
  <circle cx="30" cy="23.2" r="1.2" fill="#FEF08A"/>

  <!-- Big Rugged Rear Off-road Tire -->
  <rect x="6" y="38" width="9" height="15" rx="3.5" fill="url(#luxTire)"/>
  <path d="M6 41H15M6 45H15M6 49H15" stroke="#475569" stroke-width="1.2"/>
  <!-- Rear Shock Absorber Spring -->
  <line x1="13" y1="39" x2="17" y2="34" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Big Rugged Front Off-road Tire -->
  <rect x="37" y="38" width="9" height="15" rx="3.5" fill="url(#luxTire)"/>
  <path d="M37 41H46M37 45H46M37 49H46" stroke="#475569" stroke-width="1.2"/>
  <circle cx="41.5" cy="45.5" r="2.5" fill="#E2E8F0"/>
  <circle cx="41.5" cy="45.5" r="1" fill="#0F172A"/>
  <!-- Front Shock Absorber Spring -->
  <line x1="39" y1="39" x2="35" y2="34" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Buggy Aerodynamic Bodywork / Hood (Cyan/Blue) -->
  <path d="M12 40L16 35H34L40 40L38 46L34 47L16 47L12 40Z" fill="url(#luxBuggyBody)"/>
  <path d="M16 36H34L37 39L15 39L16 36Z" fill="#BAE6FD" fill-opacity="0.6"/>

  <!-- Front Steel Bull-Bar Bumper -->
  <path d="M38 43C42 43 45 45 45 48L38 48" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- LED Buggy Headlight -->
  <circle cx="37" cy="41" r="2.5" fill="#FEF08A" filter="url(#luxGlow)"/>
  <circle cx="37" cy="41" r="1.2" fill="#FFFFFF"/>

  <!-- High-Tech Gear Badge / "250cc & VIP" Star (Top Left) -->
  <circle cx="12" cy="14" r="7" fill="url(#luxGoldBadge)" filter="url(#luxGlow)"/>
  <path d="M12 9.5L13.2 12.2L16 12.5L13.8 14.4L14.4 17.2L12 15.8L9.6 17.2L10.2 14.4L8 12.5L10.8 12.2L12 9.5Z" fill="#FFFFFF"/>
</svg>