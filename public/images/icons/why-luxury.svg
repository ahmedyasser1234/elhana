<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="whyCrownBody" x1="12" y1="16" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="80%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0B1E36"/>
    </linearGradient>
    <linearGradient id="whyGoldBase" x1="14" y1="38" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="whyRubyGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="whyEmeraldGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="whyCrownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="32" cy="54" rx="22" ry="4" fill="#0284C7" fill-opacity="0.3"/>

  <!-- Sparkling Ambient Magic Stars -->
  <path d="M12 14L13.5 10.5L17 9L13.5 7.5L12 4L10.5 7.5L7 9L10.5 10.5L12 14Z" fill="#F59E0B"/>
  <path d="M52 16L53.5 13L56.5 12L53.5 11L52 8L50.5 11L47.5 12L50.5 13L52 16Z" fill="#38BDF8"/>
  <circle cx="21" cy="9" r="1.5" fill="#FDE047"/>
  <circle cx="43" cy="9" r="1.5" fill="#67E8F9"/>

  <!-- Main Luxury 3D Crown Body -->
  <path d="M14 42L10 21L21 28L32 15L43 28L54 21L50 42H14Z" fill="url(#whyCrownBody)" filter="url(#whyCrownGlow)"/>

  <!-- Glossy Highlight on Crown Peaks -->
  <path d="M14 40L11 23L16 26L18 39H14Z" fill="#7DD3FC" fill-opacity="0.5"/>
  <path d="M32 18L36 29L32 39L28 29L32 18Z" fill="#FFFFFF" fill-opacity="0.25"/>
  <path d="M50 40L53 23L48 26L46 39H50Z" fill="#BAE6FD" fill-opacity="0.4"/>

  <!-- Golden Imperial Base Band -->
  <rect x="12" y="40" width="40" height="7" rx="3.5" fill="url(#whyGoldBase)" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Inlay Filigree on Golden Band -->
  <circle cx="20" cy="43.5" r="2" fill="url(#whyRubyGem)"/>
  <circle cx="26" cy="43.5" r="2" fill="url(#whyEmeraldGem)"/>
  <circle cx="32" cy="43.5" r="2.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8"/>
  <circle cx="38" cy="43.5" r="2" fill="url(#whyEmeraldGem)"/>
  <circle cx="44" cy="43.5" r="2" fill="url(#whyRubyGem)"/>

  <!-- Large Sparkling Jewels on the 5 Peaks -->
  <!-- Left Outer Peak -->
  <circle cx="10" cy="21" r="3.2" fill="url(#whyGoldBase)"/>
  <circle cx="10" cy="21" r="1.5" fill="#FFFFFF"/>
  <!-- Left Mid Peak -->
  <circle cx="21" cy="28" r="2.8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8"/>
  <!-- Center Main Imperial Peak -->
  <circle cx="32" cy="15" r="4.2" fill="url(#whyGoldBase)"/>
  <circle cx="32" cy="15" r="2" fill="#FFFFFF"/>
  <path d="M32 8L33.5 11L36.5 11.5L34 13.5L35 16.5L32 15L29 16.5L30 13.5L27.5 11.5L30.5 11L32 8Z" fill="#FDE68A"/>
  <!-- Right Mid Peak -->
  <circle cx="43" cy="28" r="2.8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8"/>
  <!-- Right Outer Peak -->
  <circle cx="54" cy="21" r="3.2" fill="url(#whyGoldBase)"/>
  <circle cx="54" cy="21" r="1.5" fill="#FFFFFF"/>

  <!-- Lower Marine Wave Crest Line (Representing Yachts & Desert) -->
  <path d="M16 50C22 48 26 52 32 50C38 48 42 52 48 50" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round"/>
</svg>