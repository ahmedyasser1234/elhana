<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="16" y1="20" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="12" y1="18" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="snorkelTube" x1="42" y1="8" x2="56" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="siliconeSkirt" x1="14" y1="18" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Ambient Bubbles Floating -->
  <circle cx="12" cy="16" r="2.5" fill="#67E8F9" fill-opacity="0.6"/>
  <circle cx="11" cy="15" r="0.8" fill="#FFFFFF"/>
  <circle cx="18" cy="11" r="1.8" fill="#67E8F9" fill-opacity="0.5"/>
  <circle cx="28" cy="9" r="1.2" fill="#67E8F9" fill-opacity="0.7"/>

  <!-- Snorkel Tube Behind Mask -->
  <!-- Upper Tube with Safety Splash Guard -->
  <path d="M48 8C48 8 50 16 50 24C50 34 48 42 42 46C38 48 35 48 33 46" stroke="url(#snorkelTube)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Splash Guard Top (High Visibility Orange / Yellow) -->
  <rect x="46" y="7" width="5" height="5" rx="2" fill="#EF4444"/>
  <circle cx="48.5" cy="9.5" r="1.5" fill="#FDE047"/>
  <!-- Corrugated Flexible Hose Rings -->
  <path d="M47 34L51 34M46 37L50 37M44 40L48 40" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mask Silicone Outer Skirt -->
  <path d="M12 28C12 21 18 16 29 16C40 16 46 21 46 28C46 34 42 39 36 39L33 43C31 45 27 45 25 43L22 39C16 39 12 34 12 28Z" fill="url(#siliconeSkirt)"/>

  <!-- Mask Rigid Frame (Emerald) -->
  <path d="M14 27C14 22 19 18 29 18C39 18 44 22 44 27C44 32.5 40 37 35 37L32 40C30.5 41.5 27.5 41.5 26 40L23 37C18 37 14 32.5 14 27Z" fill="url(#frameGrad)" stroke="#34D399" stroke-width="1.2"/>

  <!-- Twin Crystal Lenses -->
  <!-- Left Lens -->
  <path d="M17 27C17 23 20 20 26 20C27.5 20 28 22 28 25C28 30 26 34 22 34C18 34 17 31 17 27Z" fill="url(#lensGrad)"/>
  <!-- Right Lens -->
  <path d="M41 27C41 23 38 20 32 20C30.5 20 30 22 30 25C30 30 32 34 36 34C40 34 41 31 41 27Z" fill="url(#lensGrad)"/>

  <!-- Center Bridge & Nose Pocket -->
  <path d="M27 28C27 25 31 25 31 28V36C31 38 29 39 29 39C29 39 27 38 27 36V28Z" fill="#047857"/>

  <!-- Glossy Diagonal Glass Highlight on Lenses -->
  <path d="M19 22L24 22L21 31L18 31Z" fill="#FFFFFF" fill-opacity="0.45"/>
  <path d="M33 22L38 22L35 31L32 31Z" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Side Buckles for Strap -->
  <rect x="10" y="26" width="3" height="4" rx="1" fill="#34D399"/>
  <rect x="45" y="26" width="3" height="4" rx="1" fill="#34D399"/>
</svg>
