<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="whyCarBody" x1="8" y1="24" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0B1E36"/>
    </linearGradient>
    <linearGradient id="whyCarRoof" x1="20" y1="16" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="whyCarGlass" x1="22" y1="18" x2="42" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="whyCarGold" x1="10" y1="34" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="whyWheelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="whyRimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="whyCarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Road Reflection Line -->
  <ellipse cx="32" cy="52" rx="26" ry="4" fill="#0284C7" fill-opacity="0.25"/>
  <path d="M12 52H52" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Rear Wheel -->
  <circle cx="18" cy="44" r="7.5" fill="url(#whyWheelGrad)"/>
  <circle cx="18" cy="44" r="4.8" fill="url(#whyRimGrad)"/>
  <circle cx="18" cy="44" r="2" fill="#0369A1"/>
  <circle cx="18" cy="44" r="0.8" fill="#FFFFFF"/>

  <!-- Front Wheel -->
  <circle cx="46" cy="44" r="7.5" fill="url(#whyWheelGrad)"/>
  <circle cx="46" cy="44" r="4.8" fill="url(#whyRimGrad)"/>
  <circle cx="46" cy="44" r="2" fill="#0369A1"/>
  <circle cx="46" cy="44" r="0.8" fill="#FFFFFF"/>

  <!-- Car Silhouette / Body -->
  <path d="M6 38C6 38 10 32 16 31C22 30 38 30 46 31L55 34C57 35 58 37 58 39L57 43H53C53 40 50 37.5 46 37.5C42 37.5 39 40 39 43H25C25 40 22 37.5 18 37.5C14 37.5 11 40 11 43H7L6 38Z" fill="url(#whyCarBody)"/>

  <!-- Aerodynamic Roof / Greenhouse -->
  <path d="M17 30L24 18H41L49 30H17Z" fill="url(#whyCarRoof)"/>

  <!-- Tinted Panoramic Windows with Glass Reflection -->
  <path d="M25 20L19.5 29H29.5V20H25Z" fill="url(#whyCarGlass)"/>
  <path d="M31.5 20V29H40.5L37.5 20H31.5Z" fill="url(#whyCarGlass)"/>
  <path d="M42 20L47.5 29H42V20Z" fill="url(#whyCarGlass)"/>
  
  <!-- Diagonal Glass Glare -->
  <path d="M22 22L26 22L23 28L19 28Z" fill="#FFFFFF" fill-opacity="0.5"/>
  <path d="M34 22L38 22L35 28L31 28Z" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Chrome Pillar Divider -->
  <line x1="30.5" y1="19" x2="30.5" y2="29" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Gold VIP Waistline Accent -->
  <path d="M8 35.5C18 34.5 44 34.5 56 37.5" stroke="url(#whyCarGold)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Crystal LED Xenon Headlights -->
  <path d="M52 34.5L57 36.5L54 38.5H50L52 34.5Z" fill="#FEF08A" filter="url(#whyCarGlow)"/>
  <path d="M53 35.5L56 36.5L54 37.5L52 37.5L53 35.5Z" fill="#FFFFFF"/>

  <!-- Rear Tail Light -->
  <path d="M6.5 36.5L8 35.5L8 38.5L6.5 38Z" fill="#EF4444"/>

  <!-- Floating VIP Hotel Pin / Golden Star Above Car -->
  <path d="M32 6C29.2 6 27 8.2 27 11C27 14.5 32 19 32 19C32 19 37 14.5 37 11C37 8.2 34.8 6 32 6Z" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <circle cx="32" cy="11" r="2" fill="#FFFFFF"/>
</svg>