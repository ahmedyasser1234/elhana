<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="teamSkin1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="teamSkin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="guideUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="bedouinUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="marineUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="14" y1="52" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="teamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="32" cy="56" rx="26" ry="4" fill="#000000" fill-opacity="0.35"/>

  <!-- ==================== LEFT: BEDOUIN DESERT GUIDE ==================== -->
  <!-- Body / Shoulders -->
  <path d="M10 50C10 43 14 39 21 38L24 43L18 50H10Z" fill="url(#bedouinUniform)"/>
  <!-- Head -->
  <ellipse cx="19" cy="27" rx="6" ry="7" fill="url(#teamSkin1)"/>
  <!-- Traditional Sinai Keffiyeh / Shemagh Scarf (Red & White Patterned) -->
  <path d="M12 24C12 18 16 15 22 15C26 15 28 17 28 22V27L26 34L19 35L14 32L12 24Z" fill="#DC2626"/>
  <path d="M14 20C16 17 21 16 25 17M13 24L26 23M14 28L25 28" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Black Agal Cord on Keffiyeh -->
  <path d="M13 21C16 19 22 19 26 21" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <!-- Friendly Eyes & Beard -->
  <circle cx="17.5" cy="27" r="0.9" fill="#1E293B"/>
  <circle cx="21.5" cy="27" r="0.9" fill="#1E293B"/>
  <path d="M17 31C18 32.5 21 32.5 22 31" stroke="#451A03" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ==================== RIGHT: MARINE CAPTAIN / PADI GUIDE ==================== -->
  <!-- Body / Shoulders -->
  <path d="M54 50C54 43 50 39 43 38L40 43L46 50H54Z" fill="url(#marineUniform)"/>
  <!-- Head -->
  <ellipse cx="45" cy="27" rx="6" ry="7" fill="url(#teamSkin2)"/>
  <!-- Marine Captain Cap (Navy Blue & Gold) -->
  <path d="M38 21C38 17 42 15 47 15C51 15 53 17 53 21H38Z" fill="#0B1E36"/>
  <path d="M36 21H55L53 23H38L36 21Z" fill="#1E293B"/>
  <path d="M40 21C43 19.5 49 19.5 52 21" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Anchor Insignia on Cap -->
  <circle cx="46" cy="18" r="1.2" fill="#F59E0B"/>
  <!-- Friendly Eyes & Smile -->
  <circle cx="43" cy="27" r="0.9" fill="#1E293B"/>
  <circle cx="47" cy="27" r="0.9" fill="#1E293B"/>
  <path d="M43.5" cy="30.5" d="M43 30.5C44.5 32 46.5 32 48 30.5" stroke="#7C2D12" stroke-width="1" stroke-linecap="round"/>

  <!-- ==================== CENTER: LEAD TOUR GUIDE ==================== -->
  <!-- Body / Safari Uniform Polo with Collar -->
  <path d="M21 52C21 41 24 37 32 37C40 37 43 41 43 52H21Z" fill="url(#guideUniform)"/>
  <!-- White Polo Collar -->
  <path d="M28 37L32 43L36 37" fill="#FFFFFF"/>
  <line x1="32" y1="43" x2="32" y2="48" stroke="#FFFFFF" stroke-width="1.2"/>
  <!-- Tour Guide Badge / ID Card Lanyard -->
  <rect x="29.5" y="44" width="5" height="4" rx="1" fill="#FDE047" stroke="#0F172A" stroke-width="0.8"/>
  <line x1="30.5" y1="45.5" x2="33.5" y2="45.5" stroke="#0F172A" stroke-width="0.6"/>

  <!-- Head -->
  <ellipse cx="32" cy="24" rx="7" ry="8" fill="url(#teamSkin2)"/>
  
  <!-- Safari Explorer Guide Hat (Khaki Beige) -->
  <path d="M23 18C23 13 27 10 32 10C37 10 41 13 41 18H23Z" fill="#D4D4D8"/>
  <!-- Hat Brim -->
  <path d="M20 18C25 17 39 17 44 18L43 20C38 19 26 19 21 20L20 18Z" fill="#A1A1AA"/>
  <!-- Hat Brown Leather Band -->
  <path d="M23 17C26 16 38 16 41 17" stroke="#78350F" stroke-width="1.5"/>

  <!-- Stylish Sunglasses (Mirror Aviators) -->
  <path d="M26.5 22H31V25C31 26.5 29.5 27.5 28 27.5C26.5 27.5 26.5 26 26.5 25V22Z" fill="#0F172A" stroke="#F59E0B" stroke-width="0.8"/>
  <path d="M33 22H37.5V25C37.5 26 37.5 27.5 36 27.5C34.5 27.5 33 26.5 33 25V22Z" fill="#0F172A" stroke="#F59E0B" stroke-width="0.8"/>
  <line x1="31" y1="23" x2="33" y2="23" stroke="#F59E0B" stroke-width="1"/>
  <!-- Sunglasses Reflection -->
  <line x1="27.5" y1="23.5" x2="29.5" y2="23.5" stroke="#38BDF8" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="34" y1="23.5" x2="36" y2="23.5" stroke="#38BDF8" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Big Warm Friendly Smile -->
  <path d="M29 30C30.5 32 33.5 32 35 30" stroke="#7C2D12" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Tour Guide Headset / Walkie-Talkie Mic -->
  <path d="M38 22C40 22 41 24 41 26C41 28 39 30 36 31" stroke="#475569" stroke-width="1" stroke-linecap="round" fill="none"/>
  <circle cx="35" cy="31.2" r="1.2" fill="#EF4444"/>

  <!-- ==================== BOTTOM: 5-STAR CERTIFIED TEAM RIBBON ==================== -->
  <rect x="14" y="49" width="36" height="8" rx="4" fill="url(#goldBanner)" stroke="#FFFFFF" stroke-width="1" filter="url(#teamGlow)"/>
  <!-- 5 Golden Certified Stars -->
  <path d="M20 53L20.8 54.5L22.5 54.8L21.2 56L21.6 57.8L20 56.8L18.4 57.8L18.8 56L17.5 54.8L19.2 54.5L20 53Z" fill="#FFFFFF"/>
  <path d="M26 53L26.8 54.5L28.5 54.8L27.2 56L27.6 57.8L26 56.8L24.4 57.8L24.8 56L23.5 54.8L25.2 54.5L26 53Z" fill="#FFFFFF"/>
  <path d="M32 52L33 54L35 54.4L33.5 56L34 58.2L32 57L30 58.2L30.5 56L29 54.4L31 54L32 52Z" fill="#FFFFFF"/>
  <path d="M38 53L38.8 54.5L40.5 54.8L39.2 56L39.6 57.8L38 56.8L36.4 57.8L36.8 56L35.5 54.8L37.2 54.5L38 53Z" fill="#FFFFFF"/>
  <path d="M44 53L44.8 54.5L46.5 54.8L45.2 56L45.6 57.8L44 56.8L42.4 57.8L42.8 56L41.5 54.8L43.2 54.5L44 53Z" fill="#FFFFFF"/>
</svg>