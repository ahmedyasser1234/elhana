<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="whyCalHeader" x1="12" y1="12" x2="52" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="whyCalBody" x1="12" y1="20" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="whyBadgeGrad" x1="28" y1="28" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="whyGoldRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="whyFlexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="32" cy="55" rx="22" ry="4" fill="#047857" fill-opacity="0.25"/>

  <!-- Calendar Page Back Dropshadow Sheet -->
  <rect x="15" y="15" width="38" height="36" rx="6" fill="#A7F3D0" fill-opacity="0.7"/>

  <!-- Main Calendar Page Body -->
  <rect x="12" y="13" width="38" height="38" rx="6" fill="url(#whyCalBody)" stroke="#86EFAC" stroke-width="1.5"/>

  <!-- Upper Emerald Header Bar -->
  <path d="M12 19C12 15.7 14.7 13 18 13H44C47.3 13 50 15.7 50 19V24H12V19Z" fill="url(#whyCalHeader)"/>

  <!-- Metallic Binder Rings (Gold/Chrome) -->
  <rect x="20" y="8" width="4" height="9" rx="2" fill="url(#whyGoldRing)" stroke="#FFFFFF" stroke-width="0.8"/>
  <rect x="38" y="8" width="4" height="9" rx="2" fill="url(#whyGoldRing)" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- Calendar Grid Lines / Dots -->
  <circle cx="20" cy="30" r="1.8" fill="#A7F3D0"/>
  <circle cx="28" cy="30" r="1.8" fill="#A7F3D0"/>
  <circle cx="20" cy="37" r="1.8" fill="#A7F3D0"/>
  <circle cx="28" cy="37" r="1.8" fill="#A7F3D0"/>
  <circle cx="20" cy="44" r="1.8" fill="#A7F3D0"/>

  <!-- Large 3D Verified Check Badge (Lower Right) -->
  <circle cx="42" cy="41" r="12" fill="url(#whyBadgeGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#whyFlexGlow)"/>

  <!-- Inner Concentric Ring -->
  <circle cx="42" cy="41" r="9.5" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

  <!-- Bold White Verified Checkmark -->
  <path d="M36.5 41L40.2 44.7L47.5 37" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small 24H Guarantee Golden Badge (Top Right) -->
  <rect x="36" y="16" width="12" height="6" rx="2" fill="#F59E0B"/>
  <path d="M38.5 20.5H45.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
</svg>